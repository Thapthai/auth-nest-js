version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Nline-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - auth-network
    volumes:
      - ./prisma:/app/prisma
    command: >
      sh -c "
        npm run start:prod
      "

volumes:
  mysql_data:

networks:
  auth-network:
    driver: bridge
